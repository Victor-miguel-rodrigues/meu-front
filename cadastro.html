<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-card">
            <h2>Criar conta para usuário</h2>
            <p style="color: #888; font-size: 14px; text-align: center; margin-bottom: 24px;">
                Painel administrativo - criação de contas
            </p>

            <form id="formCadastro" class="auth-form">
                <div class="form-group">
                    <label for="cadastroNome">Nome</label>
                    <input type="text" id="cadastroNome" placeholder="Seu nome" required>
                </div>

                <div class="form-group">
                    <label for="cadastroEmail">E-mail</label>
                    <input type="email" id="cadastroEmail" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="cadastroSenha">Senha</label>
                    <input type="password" id="cadastroSenha" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>

                <!-- PLANO -->
                <div class="form-group">
                    <label>Plano</label>
                    <div class="plano-opcoes">
                        <label class="plano-option">
                            <input type="radio" name="plano" value="Premium" checked>
                            <span class="plano-label"> Premium</span>
                        </label>
                    </div>
                </div>

                <!-- ✅ CAIXINHA PAGO / NÃO PAGO -->
                <div class="form-group">
                    <label>Status do pagamento</label>
                    <div class="plano-opcoes">
                        <label class="plano-option">
                            <input type="radio" name="pago" value="true" checked>
                            <span class="plano-label" style="color: #28a745;">✅ Pago</span>
                        </label>
                        <label class="plano-option">
                            <input type="radio" name="pago" value="false">
                            <span class="plano-label" style="color: #dc3545;"> Não pago</span>
                        </label>
                    </div>
                    <small style="color: #888; font-size: 12px; display: block; margin-top: 4px;">
                        Definir se o usuário já realizou o pagamento
                    </small>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Criar conta</button>
            </form>

            <div id="resultadoCadastro" class="resultado"></div>

            <!-- ❌ REMOVIDO - Link de login -->
            <!-- <p class="auth-link">Já tem conta? <a href="login.html">Faça login</a></p> -->

        </div>
    </div>


        <script>
        // ============================================
        // 🔒 BLOQUEAR ACESSO DIRETO
        // ============================================
        (function() {
            // Verifica se o usuário é admin (via localStorage)
            const isAdmin = localStorage.getItem('admin_access') === 'true';
            
            // Verifica se veio do painel admin (via URL param)
            const urlParams = new URLSearchParams(window.location.search);
            const fromAdmin = urlParams.get('admin') === 'true';

            // Se não for admin E não veio do painel, bloqueia
            if (!isAdmin && !fromAdmin) {
                alert('🔒 Acesso restrito! Esta página é apenas para administradores.');
                window.location.href = 'login.html';
            }

            // Se veio do painel, garante que o admin_access fique ativo
            if (fromAdmin) {
                localStorage.setItem('admin_access', 'true');
            }
        })();
    </script>

    <script src="script.js"></script>
</body>
</html>
