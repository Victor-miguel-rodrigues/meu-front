<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .resultado.erro-pagamento {
            display: block;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffc107;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }

        .resultado.erro-pagamento .btn-pagar {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 24px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .resultado.erro-pagamento .btn-pagar:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        .resultado.erro-pagamento .btn-verificar {
            display: inline-block;
            margin-top: 8px;
            padding: 8px 20px;
            background: transparent;
            color: #667eea;
            border: 1.5px solid #667eea;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s ease;
            text-decoration: none;
        }

        .resultado.erro-pagamento .btn-verificar:hover {
            background: #667eea;
            color: white;
        }

        .resultado.erro-pagamento .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .resultado.erro-pagamento .status-text {
            font-size: 13px;
            color: #888;
            margin-top: 8px;
        }
    </style>
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-card">
            <h2>Entrar</h2>
            <p>Acesse sua conta</p>

            <form id="formLogin" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">E-mail</label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="loginSenha">Senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginSenha" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" id="togglePassword">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Entrar</button>
            </form>

            <div id="resultadoLogin" class="resultado"></div>

            <p class="auth-link">
                Não tem conta? <a href="comprar.html">Comprar login</a>
            </p>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
